name: Showcase checks and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      VITE_CORE_API_BASE_URL: ${{ vars.MISSION_STUDIO_GATEWAY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Smoke test Pages subpath artifacts
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/fixtures/adaptive-hsi/v0.1.0/manifest.json
          test -f apps/web/dist/fixtures/wildfire-response/v0.1.0/manifest.json
          test -f apps/web/dist/fixtures/maritime-sar/v0.1.0/manifest.json
          test -f apps/web/dist/og.png
          test -d apps/web/dist/cesium/Workers
          test -f apps/web/dist/cesium/Assets/approximateTerrainHeights.json
          grep -q '/mission-studio-showcase/assets/' apps/web/dist/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: apps/web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
