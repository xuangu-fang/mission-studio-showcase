<title>Orbital Triage 测量台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#e8ebee; --panel:#fff; --panel-2:#f3f5f7; --sunk:#dfe4e8;
  --ink:#0e1418; --ink-2:#44515e; --muted:#6a7783;
  --hairline:rgba(14,20,24,.14); --rule:rgba(14,20,24,.07);
  --obs:#1a6b57;       /* 真实观测 */
  --geo:#1d5c96;       /* 真实几何 */
  --mod:#a8620f;       /* 模型 */
  --alert:#b8431c; --alert-soft:rgba(184,67,28,.13);
  --ok:#0d7a68; --ok-soft:rgba(13,122,104,.13);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme: dark;
  --ground:#0a0f13; --panel:#131a20; --panel-2:#19222a; --sunk:#0e151a;
  --ink:#e6edf2; --ink-2:#a3b1be; --muted:#7b8996;
  --hairline:rgba(230,237,242,.15); --rule:rgba(230,237,242,.08);
  --obs:#3aa88c; --geo:#549fe0; --mod:#d1913f;
  --alert:#e0714a; --alert-soft:rgba(224,113,74,.16);
  --ok:#2ba892; --ok-soft:rgba(43,168,146,.16);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0a0f13; --panel:#131a20; --panel-2:#19222a; --sunk:#0e151a;
  --ink:#e6edf2; --ink-2:#a3b1be; --muted:#7b8996;
  --hairline:rgba(230,237,242,.15); --rule:rgba(230,237,242,.08);
  --obs:#3aa88c; --geo:#549fe0; --mod:#d1913f;
  --alert:#e0714a; --alert-soft:rgba(224,113,74,.16);
  --ok:#2ba892; --ok-soft:rgba(43,168,146,.16);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:400 15.5px/1.6 "IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;margin:0;
  text-wrap:balance;letter-spacing:-.008em}
p{margin:0;max-width:66ch}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ── 顶栏：证据等级常驻 ───────────────────────── */
.top{position:sticky;top:0;z-index:20;background:var(--panel);
  border-bottom:1px solid var(--hairline)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 22px;
  display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center}
.brand{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:17px;
  letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;
  font-weight:400;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
  margin-top:2px}
.prov{display:flex;flex-wrap:wrap;gap:6px 14px;flex:1;min-width:280px}
.prov button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  font-size:12px;color:var(--ink-2);padding:3px 9px;border:1px solid var(--hairline);
  border-radius:2px;white-space:nowrap}
.prov button:hover,.prov button:focus-visible{background:var(--panel-2)}
.prov button:focus-visible{outline:2px solid var(--geo);outline-offset:2px}
.prov i{width:9px;height:9px;flex:none;border-radius:1px}
.prov .n{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:11px}

/* ── 布局 ─────────────────────────────────── */
.shell{max-width:1240px;margin:0 auto;padding:0 22px 80px;
  display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:900px){.shell{grid-template-columns:214px 1fr;gap:34px}}

nav.rail{padding:26px 0 0}
@media(min-width:900px){nav.rail{position:sticky;top:74px;align-self:start;
  max-height:calc(100vh - 92px);overflow-y:auto}}
.rail-label{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin:0 0 10px 2px}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:row;
  gap:6px;overflow-x:auto;padding-bottom:8px}
@media(min-width:900px){.rail ol{flex-direction:column;overflow:visible}}
.rail button{all:unset;cursor:pointer;display:block;width:100%;padding:10px 12px;
  border:1px solid var(--hairline);background:var(--panel);white-space:nowrap}
@media(max-width:899px){.rail button{white-space:nowrap}}
.rail button:hover{background:var(--panel-2)}
.rail button:focus-visible{outline:2px solid var(--geo);outline-offset:2px}
.rail button[aria-current="true"]{background:var(--ink);color:var(--ground);
  border-color:var(--ink)}
.rail .nm{font-weight:600;font-size:14px}
.rail .sb{font-size:11.5px;color:var(--muted);margin-top:2px}
.rail button[aria-current="true"] .sb{color:var(--ground);opacity:.72}

main{padding:26px 0 0;min-width:0}

/* ── 层内结构 ─────────────────────────────── */
.q{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
h2.layer{font-size:30px;font-weight:700;line-height:1.1;margin:6px 0 0}
.ask{font-size:18px;color:var(--ink-2);margin-top:12px;line-height:1.55;max-width:60ch}

.hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;
  background:var(--panel);border:1px solid var(--hairline);padding:22px 24px;margin-top:22px}
.hero .v{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;
  font-size:clamp(34px,5.4vw,52px);line-height:1;letter-spacing:-.02em}
.hero .u{font-size:14px;color:var(--ink-2);padding-bottom:6px}
.hero .nt{flex-basis:100%;font-size:13.5px;color:var(--muted);margin-top:4px}

.card{background:var(--panel);border:1px solid var(--hairline);padding:22px;margin-top:20px}
.card > h3{font-size:15px;font-weight:600;margin-bottom:4px}
.card > .cap{font-size:12.5px;color:var(--muted);margin-bottom:16px;max-width:70ch}
.g2{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:880px){.g2{grid-template-columns:1fr 1fr}}

.falsi{border-left:3px solid var(--mod);background:var(--panel);padding:16px 20px;
  margin-top:20px;font-size:14px;line-height:1.6;color:var(--ink-2)}
.falsi b{color:var(--mod);font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:5px}

table{border-collapse:collapse;width:100%;font-size:13px;min-width:480px}
.tw{overflow-x:auto}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--panel-2)}
tbody td{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
tbody td:first-child{font-family:"IBM Plex Sans",sans-serif}
tbody tr:last-child td{border-bottom:0}
tr.hi td{background:var(--ok-soft);font-weight:600}
tr.dim td{color:var(--muted)}

svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font-size:11px;font-family:"IBM Plex Mono",monospace}
.grid{stroke:var(--rule);stroke-width:1}
.axis{stroke:var(--hairline);stroke-width:1}
.lg{display:flex;flex-wrap:wrap;gap:7px 18px;margin-top:14px;font-size:12px;color:var(--ink-2)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;flex:none;border:1px solid var(--hairline)}

.ledger{list-style:none;margin:0;padding:0}
.ledger li{border-bottom:1px solid var(--rule);padding:16px 0;
  display:grid;grid-template-columns:1fr;gap:6px}
@media(min-width:760px){.ledger li{grid-template-columns:1fr 128px;gap:20px}}
.ledger .hy{font-size:14.5px;color:var(--ink-2)}
.ledger .dt{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.55}
.ledger .vd{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--alert);
  border:1px solid var(--alert);padding:3px 9px;justify-self:start;height:fit-content;
  white-space:nowrap}
@media(min-width:760px){.ledger .vd{justify-self:end}}

.pit{border-top:1px solid var(--rule);padding:15px 0}
.pit .sy{font-weight:600;font-size:14px;color:var(--alert)}
.pit .ca{font-size:13.5px;color:var(--ink-2);margin-top:4px;line-height:1.55}
.pit .fx{font-size:12.5px;color:var(--ok);margin-top:5px}

figure{margin:18px 0 0}
figure img{width:100%;height:auto;display:block;border:1px solid var(--hairline)}
figcaption{font-size:12.5px;color:var(--muted);margin-top:9px;line-height:1.55}

dialog{border:1px solid var(--hairline);background:var(--panel);color:var(--ink);
  max-width:560px;width:calc(100% - 40px);padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{font-size:17px;margin-bottom:12px}
dialog ul{margin:0;padding-left:20px;font-size:14px;line-height:1.75;color:var(--ink-2)}
dialog button{all:unset;cursor:pointer;margin-top:18px;font-size:13px;color:var(--geo);
  border-bottom:1px solid var(--geo)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">Orbital Triage<small>测量台 · 真实数据</small></div>
    <div class="prov" id="prov"></div>
  </div>
</header>

<div class="shell">
  <nav class="rail" aria-label="实验层">
    <div class="rail-label">四层实验</div>
    <ol id="rail"></ol>
  </nav>
  <main id="stage" aria-live="polite"></main>
</div>

<dialog id="dlg"><h3 id="dlgT"></h3><ul id="dlgL"></ul>
  <button id="dlgX" autofocus>关闭</button></dialog>

function frame(layer, body){

    <h2 class="layer">${esc(layer.name)}</h2>
    <p class="ask">${esc(layer.question)}</p>
    <div class="hero"><div class="v">${esc(layer.headline.value)}</div>

      <div class="nt">${esc(layer.headline.note)}</div></div>
    ${body}
    <div class="falsi"><b>什么会推翻它</b>${esc(layer.falsifier)}</div>`;
}

triage(L){
  const order = ["always_downlink","fixed_threshold","myopic_bayes","full","hindsight_oracle"];
  const NM = {always_downlink:["A 全下传","无星上智能"],fixed_threshold:["B 固定阈值","今天的做法"],
    myopic_bayes:["C 贝叶斯信念","无世界模型"],full:["D 信念 + 世界模型",""],
    hindsight_oracle:["E 事后真值参照","知识上界"]};
  const by = Object.fromEntries(L.scorecards.map(c=>[c.policy,c]));
  const rows = order.filter(n=>by[n]).map(n=>{
    const c=by[n], cls = n==="full"?"hi":(n==="hindsight_oracle"?"dim":"");
    return `<tr class="${cls}"><td>${NM[n][0]}<br><span style="font-size:11px;color:var(--muted)">${NM[n][1]}</span></td>
      <td>${pct(c.detection_rate)}</td><td>${pct(c.silent_discard_rate)}</td>
      <td>${pct(c.false_alarm_rate)}</td><td>${c.downlink_used}</td></tr>`;}).join("");
  return frame(L, `
  <div class="card"><h3>五条策略，同一份数据、同一个 planner、同一份预算</h3>
    <p class="cap">差异只在「知道什么、算什么账」。分母是真实烧毁<b>且当天按真实云况本来
      看得见</b>的瓦片——被厚云盖住的不计入，那不是决策失误，是物理限制。</p>
    <div class="tw"><table><thead><tr><th>策略</th><th>检出率</th><th>误删率</th>
      <th>误报率</th><th>下行用量</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="lg"><span style="color:var(--muted)">误删 = 真的烧了、当天看得见、却被丢弃且再没报上来
      —— 地面永远不会知道这个错误</span></div>
  </div>

    <p class="cap">扫过 25 个预算格点。策略间的差异只在左下角（算力和带宽都紧）才出现；
      右上角基本打平——这正是下一层要回答的问题。</p>

},

}};

/* ── 图表 ── */
function drawSweep(host, sweep){
  const rows = sweep.rows, cs = sweep.grid.compute, dl = sweep.grid.downlink;
  const gains = rows.map(r=>r.world_model_gain), mx = Math.max(...gains.map(Math.abs))||1;
  let h = `<div style="display:grid;gap:2px;grid-template-columns:78px repeat(${dl.length},1fr);
    font-family:'IBM Plex Mono',monospace;font-size:11.5px">`;
  h += `<div></div>` + dl.map(d=>`<div style="text-align:center;color:var(--muted);
    font-size:10px;padding:6px 0">下行 ${d}</div>`).join("");
  for(const c of cs){
    h += `<div style="text-align:right;padding:9px 10px 0 0;color:var(--muted);font-size:10px">算力 ${c}</div>`;
    for(const d of dl){
      const r = rows.find(x=>x.compute_per_pass===c && x.downlink_per_pass===d);
      const g = r ? r.world_model_gain : 0, t = Math.min(1, Math.abs(g)/mx);
      const bg = Math.abs(g)<0.001 ? "var(--sunk)"
        : `color-mix(in oklab, ${g>0?"var(--ok)":"var(--alert)"} ${(32+62*t).toFixed(0)}%, var(--panel-2))`;
      h += `<div style="background:${bg};padding:9px 2px;text-align:center;
        ${t>0.45?"color:#fff;font-weight:500":""}">${g===0?"·":(g>0?"+":"")+(g*100).toFixed(1)}</div>`;
    }
  }
  host.innerHTML = h + `</div><div class="lg">
    <span><i style="background:var(--ok)"></i>世界模型占优</span>
    <span><i style="background:var(--sunk)"></i>打平</span>
    <span><i style="background:var(--alert)"></i>短视更好</span>
    <span style="color:var(--muted)">格内 = D 检出率 − C 检出率（百分点）</span></div>`;
}

function drawSens(host, pts){
  const W=440,H=230,L=50,R=18,T=20,B=44;
  const s = svgIn(host, `0 0 ${W} ${H}`);
  const x=i=>L+i*(W-L-R)/(pts.length-1), y=v=>H-B-v*(H-T-B);
  for(let g=0;g<=4;g++){const yy=T+g*(H-T-B)/4;
    s.appendChild(el("line",{class:"grid",x1:L,x2:W-R,y1:yy,y2:yy}));
    const t=el("text",{x:L-8,y:yy+4,"text-anchor":"end"}); t.textContent=((4-g)*25)+"%";
    s.appendChild(t);}
  s.appendChild(el("line",{class:"axis",x1:L,x2:W-R,y1:H-B,y2:H-B}));
  for(const [k,c,lab] of [["detection","var(--geo)","检出率"],["false_alarm","var(--alert)","误报率"]]){
    s.appendChild(el("path",{d:pts.map((p,i)=>`${i?"L":"M"}${x(i)},${y(p[k])}`).join(" "),
      fill:"none",stroke:c,"stroke-width":2.5}));
    pts.forEach((p,i)=>s.appendChild(el("circle",{cx:x(i),cy:y(p[k]),r:3.2,fill:c,
      stroke:"var(--panel)","stroke-width":2})));
    const t=el("text",{x:W-R,y:y(pts[0][k])-9,"text-anchor":"end"});
    t.setAttribute("fill",c); t.textContent=`${lab} ${pct(pts[0][k])}`; s.appendChild(t);
  }
  pts.forEach((p,i)=>{if(i%2===0){const t=el("text",{x:x(i),y:H-B+16,"text-anchor":"middle"});
    t.textContent=p.x.toFixed(2); s.appendChild(t);}});
  const ax=el("text",{x:L,y:H-B+32}); ax.textContent="上报门槛 report_threshold"; s.appendChild(ax);
}

function drawPost(host, post){
  const W=440,H=230,L=50,R=18,T=20,B=44;
  const s = svgIn(host, `0 0 ${W} ${H}`);
  const {edges,counts,n}=post, bw=(W-L-R)/counts.length, mx=Math.max(...counts);
  s.appendChild(el("line",{class:"axis",x1:L,x2:W-R,y1:H-B,y2:H-B}));
  counts.forEach((c,i)=>{
    const h=(c/mx)*(H-T-B), x=L+i*bw, edge = i===0||i===counts.length-1;
    s.appendChild(el("rect",{x:x+2,y:H-B-h,width:bw-4,height:h,
      fill:edge?"var(--geo)":"var(--sunk)",stroke:"var(--hairline)"}));
    const t=el("text",{x:x+bw/2,y:H-B-h-6,"text-anchor":"middle"});
    t.setAttribute("font-size","10");
    t.textContent=(c/n*100).toFixed(c/n>0.02?0:1)+"%"; s.appendChild(t);
    if(i%2===0){const e=el("text",{x:x+bw/2,y:H-B+16,"text-anchor":"middle"});
      e.setAttribute("font-size","10"); e.textContent=edges[i].toFixed(2); s.appendChild(e);}
  });
  const ax=el("text",{x:L,y:H-B+32}); ax.textContent=`目标事件后验 p（n=${n} 次观测）`;
  s.appendChild(ax);
}

function drawWaterfall(host, scaling){
  const s2 = scaling.find(r=>r.fleet_key==="sentinel2") || scaling[0];
  const total = s2.median_total_h;
  const segs = [["① 重访等待","哪颗星能飞到这块地上空，且有光、没云",s2.median_revisit_wait_h,"var(--alert)"],
    ["② 星上处理","花算力算出结论",120/3600,"var(--geo)"],
    ["③ 下传等待","这颗星什么时候过地面站",s2.median_downlink_wait_h,"var(--ok)"]];
  let acc=0;
  host.innerHTML = segs.map(([n,sub,v,c])=>{
    const left=acc/total*100, w=Math.max(v/total*100,0.7); acc+=v;
    return `<div style="display:grid;grid-template-columns:120px 1fr 78px;align-items:center;
      gap:12px;padding:10px 0;border-top:1px solid var(--rule)">
      <div style="font-size:13.5px">${n}<div style="font-size:11px;color:var(--muted);
        margin-top:1px">${sub}</div></div>
      <div style="height:24px;background:var(--sunk);position:relative">
        <div style="position:absolute;top:0;bottom:0;left:${left}%;width:${w}%;background:${c}"></div></div>
      <div style="text-align:right;font-family:'IBM Plex Mono',monospace;font-size:14px">
        ${v<0.1?(v*60).toFixed(0)+"min":hrs(v)}</div></div>`;
  }).join("") + `<div style="display:grid;grid-template-columns:120px 1fr 78px;gap:12px;
    padding:11px 0;border-top:1px solid var(--hairline);font-weight:600">
    <div style="font-size:13.5px">客户收到告警</div><div></div>
    <div style="text-align:right;font-family:'IBM Plex Mono',monospace;font-size:14px">${hrs(total)}</div></div>
    <div class="lg"><span style="color:var(--muted)">重访等待占
      ${pct(s2.median_revisit_wait_h/total,0)}——多打一颗星和多建一个地面站，成本差着数量级</span></div>`;
}

function drawPlanes(host, planes){
  const W=880,H=190,L=40,R=18,T=16,B=40;
  const s = svgIn(host, `0 0 ${W} ${H}`);
  const {bins,counts,total}=planes, bw=(W-L-R)/bins.length, mx=Math.max(...counts);
  s.appendChild(el("line",{class:"axis",x1:L,x2:W-R,y1:H-B,y2:H-B}));
  counts.forEach((c,i)=>{
    const h=(c/mx)*(H-T-B), x=L+i*bw, big=c>=20;
    s.appendChild(el("rect",{x:x+2,y:H-B-h,width:bw-4,height:h,
      fill:big?"var(--alert)":"var(--sunk)",stroke:"var(--hairline)"}));
    if(c>0){const t=el("text",{x:x+bw/2,y:H-B-h-5,"text-anchor":"middle"});
      t.setAttribute("fill",big?"var(--alert)":"var(--muted)");
      t.setAttribute("font-size","10"); t.textContent=c; s.appendChild(t);}
    if(i%3===0){const t=el("text",{x:x+bw/2,y:H-B+15,"text-anchor":"middle"});
      t.setAttribute("font-size","10"); t.textContent=bins[i]+"°"; s.appendChild(t);}
  });
  const ax=el("text",{x:L,y:H-B+31});
  ax.textContent=`升交点赤经 RAAN（15° 一箱）· 共 ${total} 颗`; s.appendChild(ax);
}

function drawDaylight(host, rows){
  const W=880,H=260,L=54,R=20,T=20,B=50;
  const s = svgIn(host, `0 0 ${W} ${H}`);
  const gw=(W-L-R)/rows.length, bw=Math.min(56,gw*0.3);
  const mx=Math.max(...rows.flatMap(r=>[r.optical.gap_p90_h,r.no_sun.gap_p90_h]))*1.15;
  const y=v=>H-B-(v/mx)*(H-T-B);
  for(let g=0;g<=4;g++){const yy=T+g*(H-T-B)/4;
    s.appendChild(el("line",{class:"grid",x1:L,x2:W-R,y1:yy,y2:yy}));
    const t=el("text",{x:L-8,y:yy+4,"text-anchor":"end"});
    t.textContent=(mx*(4-g)/4).toFixed(0)+"h"; s.appendChild(t);}
  s.appendChild(el("line",{class:"axis",x1:L,x2:W-R,y1:H-B,y2:H-B}));
  rows.forEach((r,i)=>{
    const cx=L+gw*(i+0.5);
    [["optical","var(--alert)",-1],["no_sun","var(--ok)",1]].forEach(([k,c,side])=>{
      const v=r[k].gap_p90_h, x=cx+side*(bw/2+2)-bw/2;
      s.appendChild(el("rect",{x,y:y(v),width:bw,height:(H-B)-y(v),fill:c}));
      const t=el("text",{x:x+bw/2,y:y(v)-6,"text-anchor":"middle"});
      t.setAttribute("fill",c); t.textContent=v.toFixed(1)+"h"; s.appendChild(t);});
    const n=el("text",{x:cx,y:H-B+17,"text-anchor":"middle"});
    n.textContent="Planet ×"+r.n; s.appendChild(n);
    const p=el("text",{x:cx,y:H-B+32,"text-anchor":"middle"}); p.setAttribute("font-size","10");
    p.textContent=`${r.optical.passes_per_day} → ${r.no_sun.passes_per_day} 次/天`;
    s.appendChild(p);
  });
}

function drawSeries(host, spec){
  const W=440,H=250,L=44,R=16,T=18,B=46;
  const s = svgIn(host, `0 0 ${W} ${H}`);
  const all=Object.values(spec.series).flat();
  const mx=Math.max(...all.map(p=>p.z)), mn=Math.min(...all.map(p=>p.z),-3);
  const y=v=>H-B-((v-mn)/(mx-mn))*(H-T-B);
  const n=Math.max(...Object.values(spec.series).map(a=>a.length));
  const x=i=>L+i*(W-L-R)/Math.max(n-1,1);
  s.appendChild(el("line",{class:"grid",x1:L,x2:W-R,y1:y(0),y2:y(0)}));
  const z0=el("text",{x:L-7,y:y(0)+4,"text-anchor":"end"}); z0.textContent="0"; s.appendChild(z0);
  const first=Object.values(spec.series)[0].findIndex(p=>p.post);
  if(first>0){const xx=x(first)-((x(1)-x(0))/2);
    s.appendChild(el("line",{x1:xx,x2:xx,y1:T,y2:H-B,stroke:"var(--alert)","stroke-width":2,opacity:.5}));
    const t=el("text",{x:xx+5,y:T+11}); t.setAttribute("fill","var(--alert)");
    t.textContent="起火"; s.appendChild(t);}
  Object.entries(spec.series).forEach(([geom,pts],gi)=>{
    const c = gi===0?"var(--geo)":"var(--ok)";
    s.appendChild(el("path",{d:pts.map((p,i)=>`${i?"L":"M"}${x(i)},${y(p.z)}`).join(" "),
      fill:"none",stroke:c,"stroke-width":2.2}));
    pts.forEach((p,i)=>s.appendChild(el("circle",{cx:x(i),cy:y(p.z),r:2.8,fill:c,
      stroke:"var(--panel)","stroke-width":1.4})));
    const t=el("text",{x:W-R,y:y(pts[pts.length-1].z)+(gi?13:-6),"text-anchor":"end"});
    t.setAttribute("fill",c); t.textContent=geom; s.appendChild(t);});
  const ax=el("text",{x:L,y:H-B+30}); ax.textContent="按成像时间排序（升轨 / 降轨各一条）";
  s.appendChild(ax);
}

/* ── 切换 ── */
function show(id){
  const layer = D.layers.find(l=>l.id===id) || D.layers[0];
  $("stage").innerHTML = RENDER[layer.id](layer);
  document.querySelectorAll("#rail button").forEach(b=>
    b.setAttribute("aria-current", String(b.dataset.l===layer.id)));
  if(layer.id==="triage")       drawSweep($("sweepHeat"), layer.sweep);
  if(layer.id==="agent"){       drawSens($("sensChart"), layer.sensitivity.threshold);
                                drawPost($("postChart"), layer.posterior); }
  if(layer.id==="constellation"){drawWaterfall($("waterfall"), layer.scaling);
                                drawPlanes($("planeChart"), layer.planes); }
  if(layer.id==="sensor"){      drawDaylight($("dayChart"), layer.daylight);
                                drawSeries($("sarSeries"), layer.series); }
  if(location.hash.slice(1)!==layer.id) history.replaceState(null,"","#"+layer.id);
  window.scrollTo({top:0,behavior:"instant"});
}
addEventListener("hashchange",()=>show(location.hash.slice(1)));
show(location.hash.slice(1) || "rig");
</script>
